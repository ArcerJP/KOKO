name: API Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: koko-api-dev-deploy
  cancel-in-progress: false

env:
  HUSKY: "0"
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: API Deploy Verification
    if: >-
      github.repository == 'ArcerJP/KOKO' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy_allowed: ${{ steps.gate.outputs.deploy_allowed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ArcerJP/KOKO
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check deployment eligibility
        id: gate
        run: node .github/scripts/api-deploy.mjs gate
        env:
          KOKO_API_AUTO_DEPLOY_ENABLED: ${{ vars.KOKO_API_AUTO_DEPLOY_ENABLED }}
      - run: npm ci --include=dev --strict-peer-deps
      - run: npm run test:deploy-workflow
      - run: npm run typecheck:api
      - run: npm run test:api
      - run: npm run build:api

  deploy:
    name: API Deploy to Development
    needs: verify
    if: >-
      needs.verify.result == 'success' && needs.verify.outputs.deploy_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: koko-api-dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ArcerJP/KOKO
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --include=dev --strict-peer-deps
      - run: npm run build:shared
      - name: Guard and deploy the verified commit
        run: node .github/scripts/api-deploy.mjs deploy
        env:
          KOKO_API_AUTO_DEPLOY_ENABLED: ${{ vars.KOKO_API_AUTO_DEPLOY_ENABLED }}
          KOKO_API_VERIFY_RESULT: ${{ needs.verify.result }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
